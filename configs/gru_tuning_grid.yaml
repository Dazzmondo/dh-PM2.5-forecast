# E9 tuning: a small grid for the GRU on ONE selection fold (train 2018-2022, validate 2023), one seed.
# 2 (hidden size) x 3 (learning rate) x 2 (loss: squared error vs absolute error, the winner of E6b for XGBoost) = 12 configurations;
# dropout is fixed at 0.0 (a one-layer GRU of this size has little to regularise, and the grid is capped at 12).
# Early stopping on an inner window; max 50 epochs.
experiment: m3_neural
run_name: gru_grid
grid:
  hidden_size: [32, 64]
  lr: [0.001, 0.003, 0.01]
  loss: [mse, l1]
hp:
  dropout: 0.0
seeds: [0]
loss: mse
max_epochs: 50
patience: 7
