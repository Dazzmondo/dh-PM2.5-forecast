# A few-minute check that the benchmark runs on a machine (and that XGBoost and PyTorch really see the GPU), before the real run.
# It writes to its own MLflow experiment so the real benchmark (compute_benchmark.yaml) stays clean. Not a result.
experiment: m3_benchmark_check
feature_set: A
time_features: cyclical
repeats: 2
seed: 0
threads: [1, 2]
xgb_configs:
  tiny: {n_estimators: 100, learning_rate: 0.1, max_depth: 6}
gru:
  hidden_size: 32
  num_layers: 1
  dropout: 0.0
  lr: 0.003
  batch_size: 256
gru_epochs: 1
gru_repeats: 2
gru_cpu_threads: 4
