# E7c: round 2 of the XGBoost search, with the absolute-error objective. The space is narrowed around where E7 and E7b converged
# (hypotheses T1-T7 in section 3.3 of docs/M3.md) and the cap on boosting rounds is raised from 2000 to 4000 because two E7b studies
# reached or nearly reached it. TPE only: the comparison of samplers was made in E7 and E7b.
experiment: m3_hpo_round2
feature_set: A
time_features: cyclical
target: absolute
objective: reg:absoluteerror
samplers: [tpe]
seeds: [0, 1, 2]
n_trials: 60
early_stopping_rounds: 50
n_estimators: 4000
space:
  learning_rate: {low: 0.005, high: 0.05, log: true}
  max_depth: {low: 5, high: 9, type: int}
  min_child_weight: {low: 5, high: 30, type: int}
  subsample: {low: 0.5, high: 0.9}
  colsample_bytree: {low: 0.6, high: 1.0}
  reg_lambda: {low: 0.001, high: 10, log: true}
  reg_alpha: {low: 0.1, high: 20, log: true}
  gamma: {low: 0.0, high: 3.0}
