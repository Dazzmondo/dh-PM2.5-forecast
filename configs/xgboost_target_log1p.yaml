# E3: xgboost predicts log1p of the target (negatives clipped to 0 inside the model step); scored in ug/m3.
# Everything else is as in the reference configuration of the same model (feature set A, cyclical time features, absolute target).
experiment: m3_features
run_name: xgboost_A_target_log1p
model: xgboost
settings: [F, D]
feature_set: A
time_features: cyclical
target: log1p
scaling: none
seed: 0
params:
  n_estimators: 500
  learning_rate: 0.1
  max_depth: 6
