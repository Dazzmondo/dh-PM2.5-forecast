# E3: xgboost predicts the CHANGE from the current block (forecast = current + predicted change).
# Everything else is as in the reference configuration of the same model (feature set A, cyclical time features, absolute target).
experiment: m3_features
run_name: xgboost_A_target_change
model: xgboost
settings: [F, D]
feature_set: A
time_features: cyclical
target: change
scaling: none
seed: 0
params:
  n_estimators: 500
  learning_rate: 0.1
  max_depth: 6
